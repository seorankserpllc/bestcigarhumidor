<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="780" height="180">
  <defs>
    <radialGradient id="logoLeatherBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2e180e"/>
      <stop offset="60%" stop-color="#160b07"/>
      <stop offset="100%" stop-color="#0a0503"/>
    </radialGradient>
    <linearGradient id="logoGoldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d6"/>
      <stop offset="25%" stop-color="#e5b04c"/>
      <stop offset="60%" stop-color="#bf7c20"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="logoEmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fed7aa"/>
      <stop offset="65%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- CREST EMBLEM -->
  <g transform="translate(15, 15)">
    <rect x="5" y="5" width="140" height="140" rx="28" fill="url(#logoLeatherBg)" stroke="url(#logoGoldFoil)" stroke-width="2.5" filter="url(#logoShadow)"/>
    <rect x="12" y="12" width="126" height="126" rx="22" fill="none" stroke="#381c10" stroke-width="1.5"/>

    <path d="M75 22 L116 45 L116 90 C116 116 75 135 75 135 C75 135 34 116 34 90 L34 45 Z" 
          fill="#170c07" stroke="url(#logoGoldFoil)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Crown -->
    <g fill="url(#logoGoldFoil)" transform="translate(75, 48) scale(0.48) translate(-75, -48)">
      <path d="M50 55 L56 38 L68 50 L75 32 L82 50 L94 38 L100 55 Z"/>
      <circle cx="56" cy="34" r="2.5"/>
      <circle cx="75" cy="28" r="3.5"/>
      <circle cx="94" cy="34" r="2.5"/>
      <rect x="51" y="57" width="48" height="3" rx="1.5"/>
    </g>

    <!-- Torpedo Vitola -->
    <g transform="rotate(-28 75 80)">
      <rect x="48" y="74" width="46" height="11" rx="2.5" fill="#3e1f13" stroke="url(#logoGoldFoil)" stroke-width="0.8"/>
      <path d="M48 74 C40 76, 36 79.5, 36 79.5 C36 79.5, 40 83, 48 85 Z" fill="#2a140b" stroke="url(#logoGoldFoil)" stroke-width="0.8"/>
      <rect x="54" y="73.5" width="9" height="12" fill="url(#logoGoldFoil)" rx="1"/>
      <rect x="56" y="74.5" width="5" height="10" fill="#881337" rx="0.8"/>
      <circle cx="58.5" cy="79.5" r="1.5" fill="url(#logoGoldFoil)"/>
      <rect x="94" y="74" width="3" height="11" fill="#4b5563"/>
      <circle cx="98" cy="79.5" r="3.2" fill="url(#logoEmber)"/>
      <circle cx="98" cy="79.5" r="1.2" fill="#ffffff"/>
    </g>

    <!-- Smoke Curl -->
    <path d="M96 68 C104 56, 92 46, 100 36" 
          fill="none" stroke="url(#logoGoldFoil)" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

    <!-- BCH Banner -->
    <g transform="translate(0, 95)">
      <path d="M48 6 L75 1 L102 6 L98 16 L75 12 L52 16 Z" fill="#0d0604" stroke="url(#logoGoldFoil)" stroke-width="1"/>
      <text x="75" y="10" font-family="'Cinzel', Georgia, serif" font-size="6.5" font-weight="900" fill="url(#logoGoldFoil)" text-anchor="middle" letter-spacing="2">
        B•C•H
      </text>
    </g>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(180, 42)">
    <text x="0" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#d4973b" letter-spacing="4" text-transform="uppercase">
      THE AFICIONADO'S STORAGE AUTHORITY
    </text>

    <!-- Heading: BEST CIGAR HUMIDOR -->
    <text x="0" y="68" font-family="'Cinzel', 'Georgia', serif" font-size="42" font-weight="700" fill="url(#logoGoldFoil)" letter-spacing="4">
      BEST CIGAR
    </text>
    <text x="350" y="68" font-family="'Cinzel', 'Georgia', serif" font-size="42" font-weight="900" fill="#f5eee6" letter-spacing="5">
      HUMIDOR
    </text>

    <!-- Fine Gold Accent Line -->
    <line x1="0" y1="84" x2="560" y2="84" stroke="url(#logoGoldFoil)" stroke-width="1.5" opacity="0.7"/>

    <!-- Domain Subtext -->
    <g transform="translate(0, 106)">
      <text x="0" y="0" font-family="'Plus Jakarta Sans', monospace" font-size="12" font-weight="700" fill="#e5b04c" letter-spacing="2">
        BESTCIGARHUMIDOR.COM
      </text>
      <text x="210" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#a8a29e" letter-spacing="1">
        • Humidor Selector • Reviews &amp; Catalog • Build vs. Buy
      </text>
    </g>
  </g>
</svg>